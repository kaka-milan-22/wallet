[project]
name = "wallet"
version = "0.1.0"
description = "DeFi CLI wallet — Phase 1 (basics: account, transfer, approve, history)"
requires-python = ">=3.13"
dependencies = [
    "web3>=7.0",
    "eth-account>=0.13",
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pydantic>=2",
    "platformdirs>=4",
]

[project.scripts]
wallet = "wallet.cli.app:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wallet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
